# Fusion Pass web app: Nuvio web + our phone UI (github.com/oiefjqhio/fusionpass-webapp),
# static build in /var/www/fusionpass-web, installed by fusionpass/deploy.sh in that repo.
# Orange-cloud, Cloudflare-only via ufw.
server {
    listen 80;
    server_name watch.fusionpass.shop;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://watch.fusionpass.shop$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name watch.fusionpass.shop;

    ssl_certificate     /etc/letsencrypt/live/watch.fusionpass.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watch.fusionpass.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/fusionpass-web;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Defence in depth for the tokens the web core keeps in localStorage: no framing, HTTPS only, no
    # full URLs to other sites, no MIME sniffing (code review 2026-09-29, 22 F5). A script-src CSP is
    # not set: the app loads addon, image and stream origins it cannot list in advance.
    # nginx drops these in any location with its own add_header, so those locations repeat them.
    add_header Content-Security-Policy "frame-ancestors 'none'" always; add_header Strict-Transport-Security "max-age=31536000" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Content-Type-Options "nosniff" always;

    # The test address used during the build-out.
    location = /app { return 301 /$is_args$args; }
    location ^~ /app/ { return 301 /$is_args$args; }

    # Scripts and styles are version-stamped in index.html; the shell, the manifest and the
    # service-worker retirement script must always be re-checked.
    location = / { add_header Cache-Control "no-cache"; add_header Content-Security-Policy "frame-ancestors 'none'" always; add_header Strict-Transport-Security "max-age=31536000" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Content-Type-Options "nosniff" always; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; add_header Content-Security-Policy "frame-ancestors 'none'" always; add_header Strict-Transport-Security "max-age=31536000" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; add_header Content-Security-Policy "frame-ancestors 'none'" always; add_header Strict-Transport-Security "max-age=31536000" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; add_header Content-Security-Policy "frame-ancestors 'none'" always; add_header Strict-Transport-Security "max-age=31536000" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Content-Type-Options "nosniff" always; default_type application/manifest+json; }
    location / { try_files $uri $uri/ /index.html; }
}
